<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Team | Cyber Sentinel</title><link rel="stylesheet" href="../css/portal.css"></head><body data-team-mode="create"><header class="topbar"><div class="brand"><div class="logo">CS</div>Cyber Sentinel</div><a class="pill" href="../checking/index.html">Back to checking</a></header><main class="container"><section class="hero"><span class="pill">TEAM CREATION</span><h1>Create a team package</h1><p>Choose a day and package. Every member must have verified payment and must not belong to another team.</p></section><div id="teamMessage" class="alert"></div><section class="card"><h2>1. Verify the leader</h2><div class="actions"><input id="identity" placeholder="Registered email or Registration ID"><button id="verifyBtn" class="btn btn-primary" type="button">Verify member</button></div><p id="memberStatus" class="notice"></p></section><section id="teamForm" class="card hidden"><h2>2. Configure the team</h2><div class="grid"><div><label>Team name</label><input id="teamName" placeholder="Enter team name"></div><div><label>Day</label><select id="teamDay"><option value="">Select day</option><option value="DAY_1">Day 1</option><option value="DAY_2">Day 2</option></select></div><div><label>Event team package</label><select id="teamPackage"><option value="">Select a day first</option></select></div></div><p id="packageNote" class="notice"></p><div id="memberFields"></div><button id="submitTeam" class="btn btn-primary" type="button">Create team</button></section></main><script src="../js/config.js"></script><script src="../js/feedback.js"></script><script src="../js/team.js"></script></body></html>
