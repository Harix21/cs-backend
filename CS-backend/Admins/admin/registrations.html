<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registrations | Cyber Sentinel</title>
<link rel="stylesheet" href="../css/admin.css">
<style>
button{font:inherit}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar input,.toolbar select{padding:10px 12px;border:1px solid #dfe5f1;border-radius:8px}.toolbar button,.primary-btn{background:#0f172a;color:#fff;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.action-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px}.modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-card{width:min(720px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.22)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close-btn{border:none;background:#f3f4f6;border-radius:8px;padding:8px 12px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select{padding:10px 12px;border:1px solid #dfe5f1;border-radius:8px;font:inherit}.action-row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.secondary-btn{background:#e5e7eb;color:#111827;border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.warning{color:#b42318;font-weight:600}.success{color:#0f766e;font-weight:600}.info{color:#1d4ed8;font-weight:600}</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="logo"><span>CS</span><div>Cyber Sentinel<small>Admin Portal</small></div></div><nav>
<a href="dashboard.html">Dashboard</a><a class="active" href="registrations.html">Registrations</a><a href="payments.html">Payments</a><a href="events.html">Events</a><a href="coordinators.html">Coordinators</a><a href="teams.html">Teams</a><a href="attendance.html">Attendance</a><a href="announcements.html">Announcements</a><a href="emails.html">Emails</a><a href="reports.html">Reports</a></nav><button class="logout" onclick="logout()">Sign out</button></aside>
<main class="main"><header class="topbar"><div><h1>Registrations</h1><p>Manage participant registrations</p></div><button class="primary-btn" id="openAddParticipantModal">Add Participant</button></header>
<div class="toolbar"><input id="search" placeholder="Search name, college, registration ID..."><select id="dayFilter"><option value="">All Days</option><option value="DAY_1">Day 1</option><option value="DAY_2">Day 2</option><option value="BOTH">Both Days</option></select><select id="statusFilter"><option value="">All Status</option><option>CONFIRMED</option><option>PAYMENT_PENDING</option><option>CANCELLED</option></select><button onclick="loadRegistrations()">Refresh</button></div>
<div class="panel table-wrap"><table><thead><tr><th>Registration</th><th>Name</th><th>College</th><th>Department</th><th>Phone</th><th>Day</th><th>Status</th><th>Details</th></tr></thead><tbody id="rows"></tbody></table></div></main></div>
<div id="participantModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h2 style="margin:0">Register Participant</h2><button type="button" class="close-btn" data-close="participantModal">Close</button></div>
    <form id="participantForm">
      <div class="form-grid">
        <div class="field"><label for="partName">Full Name</label><input id="partName" name="name" type="text" required></div>
        <div class="field"><label for="partCollege">College</label><input id="partCollege" name="college" type="text" required></div>
        <div class="field"><label for="partDepartment">Department</label><input id="partDepartment" name="department" type="text" required></div>
        <div class="field"><label for="partPhone">Phone</label><input id="partPhone" name="phone" type="tel" required></div>
        <div class="field"><label for="partEmail">Email</label><input id="partEmail" name="email" type="email" required></div>
        <div class="field"><label for="partYear">Year</label><input id="partYear" name="year" type="text" placeholder="1st/2nd/3rd/4th"></div>
        <div class="field"><label for="partDay">Selected Day</label><select id="partDay" name="selected_day" required><option value="DAY_1">DAY_1</option><option value="DAY_2">DAY_2</option><option value="BOTH">BOTH</option></select></div>
      </div>
      <div class="action-row"><button type="button" class="secondary-btn" data-close="participantModal">Cancel</button><button type="submit" class="primary-btn">Save Registration</button></div>
    </form>
    <div id="participantMessage" class="success" style="margin-top:14px"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script src="../js/view-details.js"></script><script src="../js/admin-registrations.js"></script><script>
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function setMessage(elId,text,type='success'){const el=document.getElementById(elId);if(!el)return;el.textContent=text;el.className=type==='error'?'warning':type==='info'?'info':'success';}
function generateRegistrationCode(){const rand=Math.floor(Math.random()*9000)+1000;return 'CS-'+rand;}
document.getElementById('openAddParticipantModal').addEventListener('click',()=>openModal('participantModal'));
document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>closeModal(btn.getAttribute('data-close'))));
document.getElementById('participantForm')?.addEventListener('submit',async function(event){
  event.preventDefault();
  const form=event.currentTarget;
  const fd=new FormData(form);
  const payload={
    name:(fd.get('name')||'').toString().trim(),
    college:(fd.get('college')||'').toString().trim(),
    department:(fd.get('department')||'').toString().trim(),
    phone:(fd.get('phone')||'').toString().trim(),
    email:(fd.get('email')||'').toString().trim(),
    year:(fd.get('year')||'').toString().trim() || null
  };
  const selectedDay=(fd.get('selected_day')||'DAY_1').toString();
  if(!payload.name||!payload.college||!payload.department||!payload.phone||!payload.email){setMessage('participantMessage','Please fill all participant details.','error');return;}
  try{
    setMessage('participantMessage','Saving participant and registration...','info');
    const {data:participantData,error:participantError}=await supabaseClient.from('participants').insert([payload]).select().single();
    if(participantError) throw participantError;
    const code=generateRegistrationCode();
    const {error:regError}=await supabaseClient.from('registrations').insert([{participant_id:participantData.id,registration_code:code,selected_day:selectedDay,status:'PAYMENT_PENDING'}]);
    if(regError) throw regError;
    form.reset();
    closeModal('participantModal');
    setMessage('participantMessage','Participant registration created successfully.','success');
    await loadRegistrations();
  }catch(err){setMessage('participantMessage',err.message||'Unable to save registration.','error');}
});</script><script src="../js/admin-menu.js"></script></body></html>
