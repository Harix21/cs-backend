<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Announcements</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="app"><aside class="sidebar"><div class="logo"><span>CS</span><div>Cyber Sentinel<small>Admin Portal</small></div></div><nav><a href="dashboard.html">Dashboard</a><a href="registrations.html">Registrations</a><a href="payments.html">Payments</a><a href="events.html">Events</a><a href="coordinators.html">Coordinators</a><a href="teams.html">Teams</a><a href="attendance.html">Attendance</a><a class="active" href="announcements.html">Announcements</a><a href="emails.html">Emails</a><a href="reports.html">Reports</a></nav><button class="logout" onclick="logout()">Sign out</button></aside><main class="main"><header class="topbar"><div><h1>Announcements</h1><p>Save the announcement and open Gmail with recipients ready.</p></div></header><section class="panel"><form id="form"><label>Title<input id="title" required></label><label>Message<textarea id="message" rows="7" required></textarea></label><label>Recipients<select id="mode"><option value="all">All registered participants</option><option value="selected">Selected participants</option></select></label><div id="recipients"></div><button type="submit">Save and Open Gmail</button><p id="result" class="muted"></p></form></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script>let allEmails=[];async function load(){const{data}=await supabaseClient.from('registrations').select('id,participants(name,email)').order('created_at',{ascending:false});allEmails=(data||[]).map(r=>r.participants?.email).filter(Boolean);recipients.innerHTML=(data||[]).map(r=>`<label><input type="checkbox" value="${r.id}" data-email="${r.participants?.email||''}"> ${r.participants?.name||''} · ${r.participants?.email||''}</label><br>`).join('')}mode.onchange=()=>recipients.style.display=mode.value==='selected'?'block':'none';form.onsubmit=async e=>{e.preventDefault();const selected=[...document.querySelectorAll('#recipients input:checked')],ids=selected.map(x=>x.value),emails=selected.map(x=>x.dataset.email).filter(Boolean);if(mode.value==='selected'&&!ids.length){result.textContent='Select participants.';return}const{data:{session}}=await supabaseClient.auth.getSession();const saved=await supabaseClient.from('announcements').insert({title:title.value,message:message.value,target_scope:'ALL',created_by:session.user.id});if(saved.error){result.textContent=saved.error.message;return}const u=new URL('https://mail.google.com/mail/');u.searchParams.set('view','cm');u.searchParams.set('fs','1');u.searchParams.set('bcc',(mode.value==='all'?allEmails:emails).join(','));u.searchParams.set('su',title.value);u.searchParams.set('body',message.value);window.open(u,'_blank');result.textContent='Announcement saved. Gmail compose opened; tap Send.'};load();</script></body></html>
