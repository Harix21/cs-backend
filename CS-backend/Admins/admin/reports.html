<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reports</title><link rel="stylesheet" href="../css/admin.css"></head>
<body><div class="app"><aside class="sidebar"><div class="logo"><span>CS</span><div>Cyber Sentinel<small>Admin Portal</small></div></div><nav><a href="dashboard.html">Dashboard</a><a href="registrations.html">Registrations</a><a href="payments.html">Payments</a><a href="events.html">Events</a><a href="coordinators.html">Coordinators</a><a href="teams.html">Teams</a><a href="attendance.html">Attendance</a><a href="announcements.html">Announcements</a><a href="emails.html">Emails</a><a class="active" href="reports.html">Reports</a></nav><button class="logout" onclick="logout()">Sign out</button></aside><main class="main"><header class="topbar"><div><h1>Reports</h1><p>Export and analyze symposium data</p></div></header><div class="cards" id="reportCards"></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script src="../js/admin-menu.js"></script><script>
function downloadCsv(name,rows){if(!rows.length)return alert('No data to export.');const keys=Object.keys(rows[0]);const csv=[keys.join(','),...rows.map(row=>keys.map(key=>'"'+String(row[key]??'').replaceAll('"','""')+'"').join(','))].join('\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));link.download=name;link.click();}
async function exportRegistrations(){const {data,error}=await supabaseClient.from('registrations').select('registration_code,status,participants(name,email,phone),team_members(event_teams(team_name))');if(error)return alert(error.message);downloadCsv('registrations.csv',(data||[]).map(row=>({cs_id:row.registration_code||'',name:row.participants?.name||'',team:row.team_members?.[0]?.event_teams?.team_name||'Individual',status:row.status||'',email:row.participants?.email||'',phone:row.participants?.phone||''})));}
async function exportPayments(){const {data,error}=await supabaseClient.from('payments').select('utr,status,registrations(registration_code,selected_day,participants(name,college))');if(error)return alert(error.message);downloadCsv('payments.csv',(data||[]).map(row=>({cs_id:row.registrations?.registration_code||'',name:row.registrations?.participants?.name||'',college:row.registrations?.participants?.college||'',payment_status:row.status||'',utr:row.utr||'',day:row.registrations?.selected_day||''})));}
async function exportAttendance(){const {data,error}=await supabaseClient.from('registrations').select('registration_code,selected_day,participants(name,email,phone),food_tokens(status),main_attendance(day,status)');if(error)return alert(error.message);const rows=[];(data||[]).forEach(row=>{const days=row.selected_day==='BOTH'?['DAY_1','DAY_2']:[row.selected_day];days.forEach(day=>{const scan=(row.main_attendance||[]).find(item=>item.day===day);rows.push({cs_id:row.registration_code||'',name:row.participants?.name||'',food_token_status:row.food_tokens?.status||'AVAILABLE',phone:row.participants?.phone||'',email:row.participants?.email||'',day,present_or_absent:scan?.status==='PRESENT'?'PRESENT':'ABSENT'});});});downloadCsv('attendance-report.csv',rows);}
async function exportTeams(){const {data,error}=await supabaseClient.from('team_members').select('registrations(registration_code,participants(name)),event_teams(id,team_code,team_name)');if(error)return alert(error.message);downloadCsv('team-members-report.csv',(data||[]).map(row=>({team_member_name:row.registrations?.participants?.name||'',cs_id:row.registrations?.registration_code||'',team_name:row.event_teams?.team_name||'',team_id:row.event_teams?.team_code||row.event_teams?.id||''})));}
async function exportEventMatrix(){const {data,error}=await supabaseClient.from('attendance').select('status,registrations(registration_code,selected_day,participants(name)),events(code,name)').eq('status','PRESENT');if(error)return alert(error.message);const codes=[...new Set((data||[]).map(row=>row.events?.code||row.events?.name).filter(Boolean))];const map=new Map();(data||[]).forEach(row=>{const code=row.registrations?.registration_code;if(!code)return;if(!map.has(code))map.set(code,{cs_id:code,name:row.registrations?.participants?.name||'',day:row.registrations?.selected_day||''});map.get(code)[row.events?.code||row.events?.name]='PRESENT';});downloadCsv('event-attendance-matrix.csv',[...map.values()].map(row=>{codes.forEach(code=>{if(!row[code])row[code]='ABSENT';});return row;}));}
const cards=[['Registration Report','exportRegistrations'],['Payment Report','exportPayments'],['Attendance Report','exportAttendance'],['Team Members Report','exportTeams'],['Event Attendance Matrix','exportEventMatrix']];document.getElementById('reportCards').innerHTML=cards.map(([title,handler])=>`<div class="card"><span>${title}</span><strong>CSV</strong><button type="button" data-report="${handler}">Export</button></div>`).join('');document.querySelectorAll('[data-report]').forEach(button=>button.onclick=()=>window[button.dataset.report]());
</script></body></html>
