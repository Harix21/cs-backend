<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Participants | Cyber Sentinel</title><link rel="stylesheet" href="../css/coordinator.css"></head><body><div class="layout"><aside><b>CYBER<br>SENTINEL</b><nav><a href="dashboard.html">Dashboard</a><a href="participants.html">Participants</a><a href="payments.html">Payments</a><a href="teams.html">Teams</a><a href="attendance.html">Attendance</a><a href="announcements.html">Announcements</a><a href="emails.html">Email</a><a href="reports.html">Reports</a></nav><button id="logout">Logout</button></aside><main><header><div><small>COORDINATOR PORTAL</small><h1>Email Participants</h1><p>Gmail opens with the selected recipients, subject, and message ready.</p></div><strong id="profile"></strong></header><section class="card"><label>Event<select id="event"></select></label><label>Template<select id="template"><option>Registration confirmed</option><option>Payment reminder</option><option>Event announcement</option></select></label><label>Subject<input id="subject"></label><label>Message<textarea id="message" rows="7"></textarea></label><label><input id="sendAll" type="checkbox"> Send to all assigned participants</label><div id="recipients"></div><button id="sendButton" type="button">Open Gmail Compose</button><p id="result"></p></section></main></div><script type="module">import{supabase}from'../js/supabase.js';const{data:{session}}=await supabase.auth.getSession();if(!session)location.href='login.html';const{data:a}=await supabase.from('event_coordinators').select('event_id,events(id,code,name)').eq('coordinator_user_id',session.user.id),events=(a||[]).map(x=>x.events).filter(Boolean);event.innerHTML='<option value="">All assigned events</option>'+events.map(x=>`<option value="${x.id}">${x.code} · ${x.name}</option>`).join('');const{data:r}=await supabase.from('event_registrations').select('registration_id').in('event_id',events.map(x=>x.id)),ids=[...new Set((r||[]).map(x=>x.registration_id))],{data:rows}=ids.length?await supabase.from('registrations').select('id,participants(name,email)').in('id',ids):{data:[]};recipients.innerHTML=(rows||[]).map(x=>`<label><input type="checkbox" value="${x.participants?.email||''}"> ${x.participants?.name||''} · ${x.participants?.email||''}</label><br>`).join('');sendAll.onchange=e=>document.querySelectorAll('#recipients input').forEach(x=>x.checked=e.target.checked);sendButton.onclick=()=>{const to=[...document.querySelectorAll('#recipients input:checked')].map(x=>x.value).filter(Boolean);if(!to.length){result.textContent='Select recipients or choose all.';return}const u=new URL('https://mail.google.com/mail/');u.searchParams.set('view','cm');u.searchParams.set('fs','1');u.searchParams.set('bcc',to.join(','));u.searchParams.set('su',subject.value||template.value);u.searchParams.set('body',message.value||`Hello,\n\nPlease see this Cyber Sentinel ${template.value.toLowerCase()} notice.`);window.open(u,'_blank');result.textContent='Gmail compose opened. Tap Send.'};logout.onclick=async()=>{await supabase.auth.signOut();location.href='login.html'};</script></body></html>
