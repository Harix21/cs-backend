<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coordinators</title>
<link rel="stylesheet" href="../css/admin.css">
<style>
.modal{position:fixed;inset:0;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modal-card{width:min(760px,100%);background:#fff;border-radius:14px;padding:22px;box-shadow:0 24px 70px rgba(15,23,42,.22)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.close-btn{border:none;background:#f3f4f6;border-radius:8px;padding:8px 12px;cursor:pointer}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field input,.field select,.field textarea{padding:10px 12px;border:1px solid #dfe5f1;border-radius:8px;font:inherit}.field textarea{resize:vertical}.action-row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}.primary-btn,.secondary-btn,.small-btn{border:none;border-radius:8px;padding:10px 14px;cursor:pointer;font-weight:600}.primary-btn{background:#0f172a;color:#fff}.secondary-btn{background:#e5e7eb;color:#111827}.small-btn{background:#eff6ff;color:#1d4ed8;padding:8px 10px}.muted{color:#64748b}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px}.event-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.warning{color:#b42318;font-weight:600}.success{color:#0f766e;font-weight:600}.info{color:#1d4ed8;font-weight:600}</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="logo"><span>2K26</span><div>CyberSentinel2k26<small>Admin Portal</small></div></div>
<nav>
<a href="dashboard.html">Dashboard</a><a href="registrations.html">Registrations</a><a href="payments.html">Payments</a><a href="events.html">Events</a><a class="active" href="coordinators.html">Coordinators</a><a href="teams.html">Teams</a><a href="attendance.html">Attendance</a><a href="announcements.html">Announcements</a><a href="emails.html">Emails</a><a href="reports.html">Reports</a>
</nav>
<button class="logout" onclick="logout()">Sign out</button>
</aside>
<main class="main">
<header class="topbar"><div><h1>Coordinators</h1><p>Manage staff accounts and event assignments</p></div><button class="primary-btn" id="openCoordinatorModal">Add Coordinator</button></header>
<div class="panel table-wrap">
<table>
<thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Active</th><th>Assigned Events</th></tr></thead>
<tbody id="coordRows"></tbody>
</table>
</div>
</main>
</div>
<div id="coordinatorModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h2 style="margin:0">Add Coordinator</h2><button type="button" class="close-btn" data-close="coordinatorModal">Close</button></div>
    <form id="coordinatorForm">
      <div class="form-grid">
        <div class="field"><label for="coordName">Name</label><input id="coordName" name="name" type="text" required></div>
        <div class="field"><label for="coordEmail">Email</label><input id="coordEmail" name="email" type="email" required></div>
        <div class="field"><label for="coordPassword">Password</label><input id="coordPassword" name="password" type="password" required minlength="6"></div>
      </div>
      <div class="action-row"><button type="button" class="secondary-btn" data-close="coordinatorModal">Cancel</button><button type="submit" class="primary-btn">Add Coordinator</button></div>
    </form>
    <div id="coordinatorMessage" class="success" style="margin-top:14px"></div>
  </div>
</div>
<div id="coordAssignModal" class="modal">
  <div class="modal-card">
    <div class="modal-head"><h2 style="margin:0">Assign Event</h2><button type="button" class="close-btn" data-close="coordAssignModal">Close</button></div>
    <form id="coordAssignForm">
      <input type="hidden" id="coordAssignId" name="coordinator_id">
      <div class="field"><label for="coordEventId">Event or Special Event</label><select id="coordEventId" name="event_id" required></select></div>
      <div class="action-row"><button type="button" class="secondary-btn" data-close="coordAssignModal">Cancel</button><button type="submit" class="primary-btn">Assign Event</button></div>
    </form>
    <div id="coordAssignMessage" class="success" style="margin-top:14px"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script>
<script>
async function loadCoordinators(){
  const {data,error}=await supabaseClient.from('profiles').select('id,name,email,role,active').eq('role','COORDINATOR').order('name');
  const b=document.getElementById('coordRows');
  if(error){b.innerHTML='<tr><td colspan="5">'+esc(error.message)+'</td></tr>';return;}
  const coordinators=data||[];
  const assignedMap={};
  window.coordinatorData={};
  if(coordinators.length){
    const {data:assignments}=await supabaseClient.from('event_coordinators').select('coordinator_user_id,events(code,name)').in('coordinator_user_id', coordinators.map(c=>c.id));
    (assignments||[]).forEach(item=>{const arr=assignedMap[item.coordinator_user_id]||[]; arr.push(item.events ? (item.events.code + ' - ' + item.events.name) : 'Unassigned'); assignedMap[item.coordinator_user_id]=arr;});
    const {data:specialAssignments}=await supabaseClient.from('special_event_coordinators').select('coordinator_user_id,special_events(code,name)').in('coordinator_user_id', coordinators.map(c=>c.id));
    (specialAssignments||[]).forEach(item=>{const arr=assignedMap[item.coordinator_user_id]||[]; arr.push(item.special_events ? ('Special (' + item.special_events.code + ' - ' + item.special_events.name + ')') : 'Unassigned special event'); assignedMap[item.coordinator_user_id]=arr;});
  }
  b.innerHTML=coordinators.map(c=>{window.coordinatorData[c.id]={...c,assigned_events:assignedMap[c.id]||[]};return '<tr><td>'+esc(c.name)+'</td><td>'+esc(c.email)+'</td><td>'+c.role+'</td><td>'+(c.active?'Active':'Disabled')+'</td><td><div class="event-list">'+(assignedMap[c.id]?.length ? assignedMap[c.id].map(v=>'<span class="pill">'+esc(v)+'</span>').join('') : '<span class="muted">No events</span>')+'</div><div style="margin-top:8px"><button class="small-btn" onclick="viewCoordinator(\''+c.id+'\')">View</button><button class="small-btn" onclick="openAssignEventModal(\''+c.id+'\')">Assign Event</button></div></td></tr>';}).join('')||'<tr><td colspan="5">No coordinators found.</td></tr>';
}
async function loadEventsForAssign(){
  const {data,error}=await supabaseClient.from('events').select('id,name,code').order('name');
  const {data:specialEvents,specialError}=await supabaseClient.from('special_events').select('id,name,code').eq('status','ACTIVE').order('name');
  const select=document.getElementById('coordEventId');
  if(!select)return;
  if(error||specialError){select.innerHTML='<option value="">'+esc((error||specialError).message)+'</option>';return;}
  select.innerHTML='<option value="">Select event</option><optgroup label="Normal events">'+(data||[]).map(e=>'<option value="EVENT:'+e.id+'">'+esc(e.code)+' - '+esc(e.name)+'</option>').join('')+'</optgroup><optgroup label="Special events">'+(specialEvents||[]).map(e=>'<option value="SPECIAL:'+e.id+'">Special ('+esc(e.code)+' - '+esc(e.name)+')</option>').join('')+'</optgroup>';
}
function openAssignEventModal(coordinatorId){
  document.getElementById('coordAssignId').value = coordinatorId;
  document.getElementById('coordAssignMessage').textContent = '';
  document.getElementById('coordAssignModal').classList.add('show');
}
function viewCoordinator(id){alert(JSON.stringify(window.coordinatorData?.[id]||{},null,2));}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}
function esc(v){return String(v ?? '').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function setMessage(elId,text,type='success'){const el=document.getElementById(elId);if(!el)return;el.textContent=text;el.className=type==='error'?'warning':type==='info'?'info':'success';}
document.getElementById('openCoordinatorModal').addEventListener('click',()=>openModal('coordinatorModal'));
document.querySelectorAll('[data-close]').forEach(btn=>btn.addEventListener('click',()=>closeModal(btn.getAttribute('data-close'))));
document.getElementById('coordinatorForm')?.addEventListener('submit',async function(event){
  event.preventDefault();
  const form=event.currentTarget;
  const fd=new FormData(form);
  const name=(fd.get('name')||'').toString().trim();
  const email=(fd.get('email')||'').toString().trim();
  const password=(fd.get('password')||'').toString();
  if(!name||!email||!password){setMessage('coordinatorMessage','Please fill in all fields.','error');return;}
  try{
    setMessage('coordinatorMessage','Creating coordinator account...','info');
    const {error}=await supabaseClient.rpc('create_coordinator', { p_name:name, p_email:email, p_password:password });
    if(error) throw error;
    form.reset();
    closeModal('coordinatorModal');
    setMessage('coordinatorMessage','Coordinator added successfully.','success');
    await loadCoordinators();
  }catch(err){setMessage('coordinatorMessage',err.message||'Unable to add coordinator.','error');}
});
document.getElementById('coordAssignForm')?.addEventListener('submit',async function(event){
  event.preventDefault();
  const form=event.currentTarget;
  const fd=new FormData(form);
  const coordinatorId=(fd.get('coordinator_id')||'').toString();
  const assignment=(fd.get('event_id')||'').toString();
  if(!coordinatorId || !assignment){setMessage('coordAssignMessage','Please select an event.','error');return;}
  try{
    const [kind,id]=assignment.split(':');
    const table=kind==='SPECIAL'?'special_event_coordinators':'event_coordinators';
    const payload=kind==='SPECIAL'?{special_event_id:id,coordinator_user_id:coordinatorId}:{event_id:id,coordinator_user_id:coordinatorId};
    const {error}=await supabaseClient.from(table).upsert(payload,{onConflict:kind==='SPECIAL'?'special_event_id,coordinator_user_id':'event_id,coordinator_user_id'});
    if(error) throw error;
    form.reset();
    closeModal('coordAssignModal');
    await loadCoordinators();
  }catch(err){setMessage('coordAssignMessage',err.message||'Unable to assign event.','error');}
});
loadEventsForAssign();
loadCoordinators();
</script>
</body><script src="../js/admin-menu.js"></script>
</html>
