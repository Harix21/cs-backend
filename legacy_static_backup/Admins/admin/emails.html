<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Send Emails</title><link rel="stylesheet" href="../css/admin.css"></head><body><div class="app"><aside class="sidebar"><div class="logo"><span>2K26</span><div>CyberSentinel2k26<small>Admin Portal</small></div></div><nav><a href="dashboard.html">Dashboard</a><a href="registrations.html">Registrations</a><a href="payments.html">Payments</a><a href="events.html">Events</a><a href="coordinators.html">Coordinators</a><a href="teams.html">Teams</a><a href="attendance.html">Attendance</a><a href="announcements.html">Announcements</a><a class="active" href="emails.html">Emails</a><a href="reports.html">Reports</a></nav><button class="logout" onclick="logout()">Sign out</button></aside><main class="main"><header class="topbar"><div><h1>Send Emails</h1><p>Gmail opens with recipients, subject, and message ready.</p></div></header><section class="panel"><label>Template<select id="template"><option>Registration confirmed</option><option>Payment reminder</option><option>Event announcement</option></select></label><label>Subject<input id="subject"></label><label>Message<textarea id="message" rows="7"></textarea></label><label><input id="sendAll" type="checkbox"> Send to all participants</label><div id="recipients"></div><button id="sendButton" type="button">Open Gmail Compose</button><p id="result" class="muted"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/supabase.js"></script><script src="../js/admin-auth.js"></script><script>let allEmails=[];async function load(){const{data}=await supabaseClient.from('registrations').select('participants(name,email)').order('created_at',{ascending:false});allEmails=(data||[]).map(r=>r.participants?.email).filter(Boolean);recipients.innerHTML=(data||[]).map(r=>`<label><input type="checkbox" value="${r.participants?.email||''}"> ${r.participants?.name||''} · ${r.participants?.email||''}</label><br>`).join('')}sendAll.onchange=e=>document.querySelectorAll('#recipients input').forEach(x=>x.checked=e.target.checked);sendButton.onclick=()=>{const emails=[...document.querySelectorAll('#recipients input:checked')].map(x=>x.value).filter(Boolean);if(!emails.length){result.textContent='Select recipients or choose all participants.';return}const u=new URL('https://mail.google.com/mail/');u.searchParams.set('view','cm');u.searchParams.set('fs','1');u.searchParams.set('bcc',sendAll.checked?allEmails.join(','):emails.join(','));u.searchParams.set('su',subject.value||template.value);u.searchParams.set('body',message.value||`Hello,\n\nPlease see this Cyber Sentinel ${template.value.toLowerCase()} notice.`);window.open(u,'_blank');result.textContent='Gmail compose opened. Review the recipients and tap Send.'};load();</script></body></html>
