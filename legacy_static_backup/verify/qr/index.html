<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Sentinel QR Pass</title><style>body{font-family:Arial,sans-serif;max-width:560px;margin:8vh auto;padding:24px;color:#10152f;text-align:center}#qrcode{display:flex;justify-content:center;margin:28px 0}#qrcode img,#qrcode canvas{width:280px;height:280px;border:14px solid #fff;box-shadow:0 8px 24px rgba(16,21,47,.14)}#token{word-break:break-all;color:#555;font-size:14px}</style></head>
<body>
<h1>Cyber Sentinel QR Pass</h1>
<p>This pass is ready to be scanned at the event entry desk. Please show this page or the QR image to an Admin or event coordinator.</p>
<div id="qrcode" aria-label="QR code for this pass"></div>
<p id="token" style="word-break:break-all;color:#555"></p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const parts=location.pathname.split('/').filter(Boolean);
const token=parts.length ? parts[parts.length-1] : '';
document.querySelector('#token').textContent=token ? `Pass token: ${token}` : 'Pass token unavailable';
if(token && typeof QRCode !== 'undefined') new QRCode(document.querySelector('#qrcode'),{text:location.href,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});
</script>
</body>
</html>
